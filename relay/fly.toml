# fly.toml app configuration file generated for pm-bot-relay on 2026-08-08T10:23:27-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pm-bot-relay'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = "echo 'relay deployed'"

[env]
  KALSHI_WS_URL = 'wss://external-api-ws.demo.kalshi.co/trade-api/ws/v2'
  LOG_LEVEL = 'INFO'
  PORT = '8080'

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
