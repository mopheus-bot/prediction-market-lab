<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark" />
		<title>Trader — Schedule</title>
		<meta name="description" content="When the bot does what, automatically." />
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e1a'/%3E%3Crect x='14' y='38' width='8' height='14' fill='%233b82f6' opacity='0.5'/%3E%3Crect x='28' y='30' width='8' height='22' fill='%233b82f6' opacity='0.75'/%3E%3Crect x='42' y='22' width='8' height='30' fill='%233b82f6'/%3E%3Ccircle cx='46' cy='18' r='2.6' fill='%2310b981'/%3E%3C/svg%3E" />
		<link rel="stylesheet" href="app.css" />
	</head>
	<body data-trading-mode="paper" data-kill-switch="false">
		<div class="app-shell">
			<div class="app-section-header">
				<h2>Schedule</h2>
				<p>When the bot does what, automatically. The dashboard shows where we are in this schedule right now.</p>
			</div>

			<!-- Schedule health (1-line, no chrome) -->
			<div class="schedule-health" id="schedule-health" data-color="ok" style="margin-bottom: 16px;">
				<span class="schedule-health-dot"></span>
				<span class="schedule-health-text" id="schedule-health-text">loading…</span>
				<a href="/app/dev#dev-schedule-runs" class="muted" style="margin-left: auto; font-size: 11px; text-decoration: none;">cron runs →</a>
			</div>

			<!-- Schedule list — every recurring action in user terms -->
			<div class="schedule-list" id="schedule-list" role="list">
				<div class="cadence-skeleton">Loading schedule…</div>
			</div>

			<footer style="text-align: center; padding: 24px; color: var(--ink-faint); font-size: 11px; font-family: var(--font-mono);">
				auto-refresh · last fetched <span id="last-fetched">—</span>
			</footer>
		</div>

		<div class="toast" id="toast" role="status" aria-live="polite"></div>

		<script src="app.js"></script>
		<script>
			// Schedule v3: a one-screen playbook of "when the bot
			// does what". Each item is a recurring action in
			// user terms (Live WebSocket, Universe scan, News
			// check, Daily recap, Model retrain, LLM calls,
			// Model registry). The status, last-ran, and
			// next-in info rides along on the right.
			//
			// The dashboard's stage panel shows which step is
			// active RIGHT NOW; this page is the full schedule
			// reference.
			let _scheduleRaw = { data: null, ts: 0 };
			const CACHE_TTL_MS = 5_000;

			async function fetchSchedulePage() {
				const now = Date.now();
				if (_scheduleRaw.data && now - _scheduleRaw.ts < CACHE_TTL_MS) return _scheduleRaw.data;
				try {
					const r = await fetch("/api/pm/cadence", { credentials: "same-origin" });
					if (!r.ok) return _scheduleRaw.data || null;
					const d = await r.json();
					_scheduleRaw = { data: d, ts: now };
					return _scheduleRaw.data;
				} catch (_e) { return _scheduleRaw.data || null; }
			}

			// The interval label as it appears in the API can be a
			// little technical ("weekly on Sunday 00:00 UTC"). For
			// the schedule list we want a tight, user-friendly
			// "when" — like "every 15 min" or "daily at 06:00 UTC".
			// The full description is the.details string from the
			// API which is already operator-friendly.
			function shortInterval(s) {
				const lbl = s.interval_label || "";
				if (lbl === "continuous") return "always on";
				if (lbl === "on demand + cron") return "on demand";
				if (lbl === "managed by train cron") return "managed by train";
				return lbl;
			}

			function renderScheduleList(data) {
				const list = $("schedule-list");
				if (!list) return;
				if (!data || !data.services || data.services.length === 0) {
					list.innerHTML = `<div class="cadence-skeleton">no schedule items yet</div>`;
					return;
				}
				// Stable order: live stream first, then crons in
				// cadence-of-action, then on-demand + managed.
				const order = ["ws", "scan", "news", "daily", "train", "llm", "model_registry"];
				const sorted = order
					.map((id) => data.services.find((s) => s.id === id))
					.filter(Boolean)
					.concat(data.services.filter((s) => !order.includes(s.id)));

				list.innerHTML = sorted.map((s) => `
					<div class="cadence-item" role="listitem" data-status="${esc(s.status)}" aria-label="${esc(s.name)}: ${esc(s.status)}">
						<div class="schedule-item-row">
							<div class="schedule-item-when">
								<span class="cadence-item-icon" aria-hidden="true">${esc(s.icon || "•")}</span>
								<span class="schedule-when-label">${esc(shortInterval(s))}</span>
							</div>
							<div class="schedule-item-body">
								<div class="cadence-item-head">
									<div class="cadence-item-name"><span>${esc(s.name)}</span></div>
									<span class="cadence-item-status" data-status="${esc(s.status)}">${esc(s.status)}</span>
								</div>
								<div class="cadence-item-details">${esc(s.description || "")}</div>
								<div class="schedule-item-time">${esc(s.details || "")}${s.next_in_ms !== null ? ` <span aria-hidden="true">·</span> next: <strong>${esc(s.next_label || "")}</strong>`: ""}</div>
							</div>
						</div>
					</div>
				`).join("");
			}

			function renderScheduleHealth(data) {
				const el = $("schedule-health");
				const text = $("schedule-health-text");
				if (!el || !text) return;
				if (!data || !data.summary) {
					el.setAttribute("data-color", "ok");
					text.textContent = "—";
					return;
				}
				const s = data.summary;
				const n = s.n_services ?? 0;
				const ok = s.n_ok ?? 0;
				const err = s.n_error ?? 0;
				if (n === 0) {
					el.setAttribute("data-color", "ok");
					text.textContent = "—";
				} else if (err === 0) {
					el.setAttribute("data-color", "ok");
					text.textContent = `all green — ${ok} of ${n} steps running cleanly`;
				} else if (err === 1) {
					el.setAttribute("data-color", "bad");
					text.textContent = `1 step needs attention — ${ok} of ${n} running cleanly`;
				} else {
					el.setAttribute("data-color", "bad");
					text.textContent = `${err} steps need attention — ${ok} of ${n} running cleanly`;
				}
			}

			async function renderSchedulePage() {
				const data = await fetchSchedulePage();
				renderScheduleList(data);
				renderScheduleHealth(data);
			}

			const _origInit = window.appPageInit;
			window.appPageInit = function schedulePageInit() {
				if (_origInit) _origInit();
				startTimers([{ fn: renderSchedulePage, ms: 5_000 }]);
				renderSchedulePage();
			};
			window.appPageOnVisible = function () {
				renderSchedulePage();
			};
		</script>
	</body>
</html>
