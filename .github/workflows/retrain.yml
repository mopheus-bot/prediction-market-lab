name: retrain

# Weekly retrain of the reversion-quality models for
# ALL 17 Kalshi verticals pm-bot covers (weather /
# economic / politics / sports / elections /
# financials / entertainment / science_technology /
# crypto / companies / commodities / mentions /
# social / world / health / transportation /
# uncategorized). The 4 legacy verticals have actual
# trade data and produce models immediately; the 13
# new verticals will produce models as the bot
# accumulates trades in them.
#
# Flow (per scripts/retrain.py):
#   1. Pull the bot's current ticker universe from D1
#      (via wrangler).
#   2. Fetch the last 7 days of Kalshi public trades
#      for each ticker (paginated GET /markets/trades).
#   3. Write per-ticker JSONL files in the format the
#      Python trainer expects.
#   4. Run the live reversion trainer once per legacy
#      vertical (walk-forward validation, 3 folds).
#   5. Convert each .joblib to the JSON tree format
#      the TS port consumes.
#   6. Upload each `<vertical>-v2.json` to R2 at
#      `pm-bot/models/reversion-<vertical>-v2.json`.
#
# The Sunday 00:00 UTC train-cron in src/cron/train-cron.ts
# then auto-registers the new R2 artifact in the D1
# `models` table with status=candidate. Operator
# promotes via the Dev page.
#
# Manual trigger: `gh workflow run retrain.yml` or the
# Actions tab → "Run workflow". Useful for ad-hoc
# retraining when trade data spikes (e.g. after a
# sharp regime change).

on:
  schedule:
    # Saturday 22:00 UTC — 2 hours before Sunday
    # 00:00 UTC train-cron, so the new artifact is
    # already in R2 when the cron runs.
    - cron: "0 22 * * 6"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of Kalshi trades to fetch per ticker (default 7)"
        required: false
        default: "7"
        type: string
      model_version:
        description: "Version label for the new model (default v2)"
        required: false
        default: "v2"
        type: string

concurrency:
  group: retrain
  cancel-in-progress: false  # don't kill a half-done retrain if a manual trigger fires

jobs:
  retrain:
    name: Pull Kalshi trades → train per vertical → upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30  # worst case: 40 tickers × 7 pages × 0.3s + 4 trainer runs

    steps:
      - name: Checkout pm-bot
        uses: actions/checkout@v4
        with:
          path: pm-bot
          fetch-depth: 1

      - name: Checkout Prediction Market Lab (sibling)
        uses: actions/checkout@v4
        with:
          repository: 
          path: Prediction Market Lab
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python trainer deps
        working-directory: the Python reference engine
        run: |
          python -m pip install --upgrade pip
          # Trainer needs sklearn + xgboost + pandas
          # per the pyproject.toml [model] group.
          python -m pip install "scikit-learn>=1.0" "xgboost>=1.7" "pandas>=1.5" "pydantic>=2.0" "numpy>=1.20"

      - name: Install pm-bot deps
        working-directory: pm-bot
        run: |
          npm install --no-audit --no-fund

      - name: Configure wrangler auth
        working-directory: pm-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Smoke-test that wrangler can talk to R2 + D1.
          npx wrangler r2 bucket list 2>&1 | head -5 || true
          npx wrangler d1 list 2>&1 | head -5 || true

      - name: Run retrain orchestrator
        working-directory: pm-bot
        env:
          # The orchestrator invokes the Python trainer
          # via `python -m predictive_markets.scripts.live.train_reversion`,
          # which needs the Prediction Market Lab package on the
          # import path. The script also pulls the bot's
          # universe from D1 via wrangler, which needs
          # the CLOUDFARE_* auth.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILDA_BOT_REPO: ${{ github.workspace }}/the Python reference engine
          PM_BOT_REPO: ${{ github.workspace }}/pm-bot
          RETRAIN_DATA_DIR: ${{ github.workspace }}/retrain-data
          RETRAIN_OUTPUT_DIR: ${{ github.workspace }}/retrain-models
          RETRAIN_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          MODEL_VERSION: ${{ github.event.inputs.model_version || 'v2' }}
        run: |
          python3 scripts/retrain.py

      - name: Upload new models as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-models-${{ github.event.inputs.model_version || 'v2' }}
          path: |
            retrain-models/*.joblib
            retrain-models/*.json
          if-no-files-found: ignore
          retention-days: 30
